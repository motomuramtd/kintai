<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NFC実働時間管理</title>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;background:#0d1117;color:#fff}
.fullscreen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ===== ローディング ===== */
#loading-screen{background:#0d1117;align-items:center;justify-content:center;gap:16px}
.spin{width:48px;height:48px;border:4px solid #333;border-top-color:#4a9eff;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-msg{color:#aaa;font-size:15px}

/* ===== セットアップ ===== */
#setup-screen{background:#1a1a2e;display:none;overflow-y:auto;align-items:flex-start;padding:20px}
.setup-card{background:#16213e;border-radius:16px;padding:28px 32px;width:100%;max-width:560px;margin:auto;border:1px solid #0f3460}
.setup-card h1{font-size:22px;margin-bottom:4px;color:#4a9eff}
.setup-card p{color:#aaa;font-size:14px;margin-bottom:24px}
.setup-section{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin:20px 0 8px;padding-top:16px;border-top:1px solid #0f3460}
.setup-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
.setup-card label{display:block;font-size:13px;color:#ccc;margin-bottom:4px;margin-top:12px}
.setup-card input{width:100%;background:#0f3460;border:1px solid #1a4a7a;color:#fff;padding:10px 12px;border-radius:8px;font-size:14px;outline:none}
.setup-card input:focus{border-color:#4a9eff}
.setup-save-btn{width:100%;margin-top:24px;padding:14px;background:#4a9eff;border:none;color:#fff;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}
.setup-hint{font-size:12px;color:#666;margin-top:10px;line-height:1.7}

/* ===== メイン画面 ===== */
#main-screen{background:#0d1117;display:none;flex-direction:column;overflow:hidden}
#main-header{background:#161b22;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #30363d}
#main-header h1{font-size:16px;font-weight:700;color:#4a9eff}
#header-right{display:flex;align-items:center;gap:8px}
#clock{font-size:20px;font-weight:700;color:#e6edf3;letter-spacing:2px}
#date-label{font-size:11px;color:#8b949e;text-align:right}
.hdr-btn{padding:7px 13px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:36px}
.hdr-btn.reg{background:#238636;color:#fff}
.hdr-btn.settings{background:#30363d;color:#ccc}
.hdr-btn.signout{background:#30363d;color:#ccc}

/* ===== スキャンエリア ===== */
#scan-area{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 18px;gap:14px}
#scan-ring{width:150px;height:150px;border-radius:50%;border:5px solid #30363d;display:flex;align-items:center;justify-content:center;position:relative;transition:all 0.3s;background:rgba(255,255,255,0.02)}
#scan-ring.ready{border-color:#4a9eff;animation:pulse-ring 2s infinite}
#scan-ring.success{border-color:#3fb950;background:rgba(63,185,80,0.08);animation:none}
#scan-ring.error{border-color:#f85149;background:rgba(248,81,73,0.08);animation:none}
@keyframes pulse-ring{0%,100%{box-shadow:0 0 0 0 rgba(74,158,255,0.5)}50%{box-shadow:0 0 0 18px rgba(74,158,255,0)}}
#scan-icon{font-size:60px;line-height:1}
#scan-msg{font-size:15px;color:#8b949e;text-align:center}
#scan-result{font-size:22px;font-weight:700;text-align:center;min-height:30px;color:#e6edf3}
#scan-sub{font-size:14px;color:#8b949e;text-align:center;min-height:20px}

/* ===== 今日の打刻リスト ===== */
#today-section{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0 12px 8px}
#today-label{font-size:12px;color:#8b949e;padding:4px 0 6px;flex-shrink:0;border-top:1px solid #21262d;padding-top:8px}
#today-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.today-row{background:#161b22;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:10px;border:1px solid #30363d}
.today-row .tr-name{flex:1;font-size:14px;font-weight:600;color:#e6edf3}
.today-row .tr-badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-in{background:#1f6feb;color:#fff}
.badge-out{background:#238636;color:#fff}
.badge-both{background:rgba(56,139,253,0.15);color:#58a6ff;border:1px solid #1f3a5e}
.today-row .tr-time{font-size:12px;color:#8b949e;text-align:right;min-width:90px}

/* ===== カード登録画面 ===== */
#register-screen{background:#0d1117;display:none;flex-direction:column;overflow:hidden}
#reg-header{background:#161b22;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #30363d;flex-shrink:0}
#reg-header h2{font-size:16px;font-weight:700;color:#e6edf3;flex:1}
.reg-close-btn{padding:7px 14px;background:#30363d;border:none;color:#ccc;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:36px}
#reg-list-wrap{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.reg-emp-row{background:#161b22;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;border:1px solid #30363d;cursor:pointer;touch-action:manipulation;transition:background 0.15s}
.reg-emp-row:active{background:#1f2937}
.reg-emp-name{flex:1;font-size:15px;font-weight:600;color:#e6edf3}
.reg-emp-id{font-size:11px;color:#8b949e;margin-top:2px}
.reg-card-status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap}
.card-registered{background:#1a3a2a;color:#3fb950}
.card-none{background:#2a2a2a;color:#666}

/* ===== カード読み取りオーバーレイ ===== */
#reg-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:800;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
#reg-overlay.show{display:flex}
#reg-overlay-name{font-size:22px;font-weight:700;color:#e6edf3}
#reg-overlay-msg{font-size:14px;color:#8b949e;text-align:center;max-width:320px;line-height:1.6}
#reg-overlay-ring{width:130px;height:130px;border-radius:50%;border:5px solid #4a9eff;display:flex;align-items:center;justify-content:center;animation:pulse-ring 1.5s infinite;transition:border-color 0.3s}
#reg-overlay-icon{font-size:52px}
#reg-overlay-uid{font-size:13px;color:#4a9eff;font-family:monospace;min-height:20px;text-align:center;word-break:break-all}
#reg-overlay-btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.rov-btn{padding:10px 22px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:44px}
.rov-btn.confirm{background:#238636;color:#fff}
.rov-btn.cancel{background:#30363d;color:#ccc}
.rov-btn.delete{background:#da3633;color:#fff}

/* ===== 復元バナー ===== */
#restore-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:600;background:#7d4e00;color:#fff;padding:8px 12px;align-items:center;gap:8px;font-size:13px;flex-shrink:0}
#restore-banner.show{display:flex}
#restore-banner button{padding:6px 12px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation;min-height:32px}
#btn-restore{background:#d97706;color:#fff}
#btn-dismiss-restore{background:#555;color:#fff}

/* ===== 操作中オーバーレイ ===== */
#op-loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:700;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#op-loading.show{display:flex}
#op-loading .spin{width:40px;height:40px}
#op-loading p{color:#aaa;font-size:14px}

/* ===== トースト ===== */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- ローディング -->
<div class="fullscreen" id="loading-screen">
  <div class="spin"></div>
  <div id="loading-msg">起動中...</div>
</div>

<!-- セットアップ -->
<div class="fullscreen" id="setup-screen">
  <div class="setup-card">
    <h1>⚙️ NFC実働時間管理 設定</h1>
    <p>kintai.html と同じ設定を入力してください（共有されます）</p>
    <div class="setup-section">Azure AD</div>
    <label>テナントID</label>
    <input id="cfg-tenant-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off">
    <label>クライアントID</label>
    <input id="cfg-client-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off">
    <div class="setup-section">SharePoint</div>
    <label>ホスト名 (例: contoso.sharepoint.com)</label>
    <input id="cfg-sp-host" placeholder="contoso.sharepoint.com" autocomplete="off">
    <label>サイトパス (例: /sites/kintai)</label>
    <input id="cfg-site-path" placeholder="/sites/kintai" autocomplete="off">
    <label>社員マスタ パス</label>
    <input id="cfg-master-path" value="勤怠管理/社員マスタ.xlsx">
    <label>勤怠データ パス</label>
    <input id="cfg-data-path" value="勤怠管理/勤怠データ.xlsx">
    <button class="setup-save-btn" id="btn-setup-save">保存して接続</button>
    <p class="setup-hint">
      ※ Azure ADアプリのリダイレクトURIに以下を追加してください:<br>
      <span id="setup-redirect-uri" style="color:#4a9eff;word-break:break-all;font-size:11px"></span><br><br>
      ※ 社員マスタ.xlsxの「社員マスタ」シートにC列ヘッダー「カードUID」を追加してください。
    </p>
  </div>
</div>

<!-- メイン画面 -->
<div class="fullscreen" id="main-screen">
  <div id="main-header">
    <div>
      <h1>📡 NFC実働時間管理</h1>
    </div>
    <div id="header-right">
      <div style="text-align:right">
        <div id="clock">--:--</div>
        <div id="date-label">----/--/--</div>
      </div>
      <button class="hdr-btn reg" id="btn-open-reg">🪪 カード登録</button>
      <button class="hdr-btn settings" id="btn-settings">⚙️</button>
      <button class="hdr-btn signout" id="btn-signout">🚪</button>
    </div>
  </div>

  <div id="scan-area">
    <div id="scan-ring">
      <span id="scan-icon">📡</span>
    </div>
    <div id="scan-msg">NFCカードをリーダーにかざしてください</div>
    <div id="scan-result"></div>
    <div id="scan-sub"></div>
  </div>

  <div id="today-section">
    <div id="today-label">本日の打刻（0件）</div>
    <div id="today-list"></div>
  </div>
</div>

<!-- カード登録画面 -->
<div class="fullscreen" id="register-screen">
  <div id="reg-header">
    <h2>🪪 NFCカード登録</h2>
    <button class="reg-close-btn" id="btn-reg-close">✕ 閉じる</button>
  </div>
  <div id="reg-list-wrap"></div>
</div>

<!-- カード読み取りオーバーレイ -->
<div id="reg-overlay">
  <div id="reg-overlay-name"></div>
  <div id="reg-overlay-ring"><span id="reg-overlay-icon">📡</span></div>
  <div id="reg-overlay-msg">カードをリーダーにかざしてください</div>
  <div id="reg-overlay-uid"></div>
  <div id="reg-overlay-btns" style="display:none">
    <button class="rov-btn confirm" id="btn-rov-confirm">✓ 登録する</button>
    <button class="rov-btn cancel"  id="btn-rov-cancel">✕ やり直す</button>
    <button class="rov-btn delete"  id="btn-rov-delete" style="display:none">🗑 削除</button>
  </div>
</div>

<!-- 復元バナー -->
<div id="restore-banner">
  <span>⚠️ 前回の未保存データ（<span id="restore-count">0</span>件）があります</span>
  <button id="btn-restore">🔄 復元する</button>
  <button id="btn-dismiss-restore">✕ 無視</button>
</div>

<!-- 操作中オーバーレイ -->
<div id="op-loading" class="fullscreen" style="position:fixed">
  <div class="spin"></div>
  <p id="op-loading-msg">処理中...</p>
</div>

<!-- トースト -->
<div id="toast"></div>

<script>
'use strict';

// ================================================================
//  定数・状態
// ================================================================
const CONFIG_KEY = 'kintai_sp_config';   // kintai.html と共有
const BK_PREFIX  = 'kintai_bk_';

const SCOPES = ['https://graph.microsoft.com/Files.ReadWrite'];

let msalInst, curAccount;
let masterDriveId, masterItemId;
let dataDriveId,   dataItemId;
let employees    = [];  // { id, name, cardUID, rowIndex }
let todayRecords = [];  // { empId, type, time }

// NFC キーボードウェッジ バッファ
let nfcBuf      = '';
let nfcTimer    = null;
let nfcMode     = 'scan';   // 'scan' | 'register'
let capturedUID = null;
let regTargetEmp = null;
let scanCooldown = false;

// ================================================================
//  ユーティリティ
// ================================================================
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtTime(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function showToast(msg, ms=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}
function showOp(msg='処理中...') {
  document.getElementById('op-loading-msg').textContent = msg;
  document.getElementById('op-loading').classList.add('show');
}
function hideOp() {
  document.getElementById('op-loading').classList.remove('show');
}
function setMsg(msg) {
  document.getElementById('loading-msg').textContent = msg;
}

// ================================================================
//  時計
// ================================================================
function startClock() {
  const days = ['日','月','火','水','木','金','土'];
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent = fmtTime(now);
    document.getElementById('date-label').textContent =
      `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
  }
  tick();
  setInterval(tick, 1000);
}

// ================================================================
//  MSAL 認証 (リダイレクトモード)
// ================================================================
async function initMsal(cfg) {
  Object.keys(sessionStorage)
    .filter(k => k.includes('interaction') || k.includes('request'))
    .forEach(k => sessionStorage.removeItem(k));
  msalInst = new msal.PublicClientApplication({
    auth: {
      clientId:    cfg.clientId,
      authority:   `https://login.microsoftonline.com/${cfg.tenantId}`,
      redirectUri: location.href.split('?')[0].split('#')[0]
    },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
  });
}

async function handleRedirect() {
  try {
    const result = await msalInst.handleRedirectPromise();
    if (result) { curAccount = result.account; return result.accessToken; }
  } catch(e) { console.warn('handleRedirect:', e); }
  return null;
}

async function getAccessToken() {
  if (!curAccount) {
    const accs = msalInst.getAllAccounts();
    if (!accs.length) { await msalInst.loginRedirect({ scopes: SCOPES }); return null; }
    curAccount = accs[0];
  }
  try {
    return (await msalInst.acquireTokenSilent({ scopes: SCOPES, account: curAccount })).accessToken;
  } catch(e) {
    await msalInst.acquireTokenRedirect({ scopes: SCOPES, account: curAccount });
    return null;
  }
}

async function signOut() {
  await msalInst.logoutRedirect({ account: curAccount });
}

// ================================================================
//  Graph API
// ================================================================
async function gGet(path) {
  const token = await getAccessToken();
  if (!token) return null;
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) throw new Error(`GET ${path} → ${res.status}: ${await res.text()}`);
  return res.json();
}

async function gPatch(path, body) {
  const token = await getAccessToken();
  if (!token) return null;
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PATCH',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`PATCH ${path} → ${res.status}: ${await res.text()}`);
  return res.json();
}

// ================================================================
//  SharePoint 初期化
// ================================================================
async function initSharePoint(cfg) {
  const site = await gGet(`/sites/${cfg.spHost}:${cfg.sitePath}`);
  const siteId = site.id;

  async function resolveFile(filePath) {
    const parts = filePath.split('/');
    const libraryName = parts[0];
    const subPath = parts.slice(1).join('/');
    const { value: drives } = await gGet(`/sites/${siteId}/drives`);
    const drive = drives.find(d => d.name === libraryName || d.webUrl.split('/').pop() === libraryName);
    if (drive) {
      const item = await gGet(`/drives/${drive.id}/root:/${subPath}`);
      return { driveId: drive.id, itemId: item.id };
    } else {
      const item = await gGet(`/sites/${siteId}/drive/root:/${filePath}`);
      return { driveId: item.parentReference.driveId, itemId: item.id };
    }
  }

  const [master, data] = await Promise.all([
    resolveFile(cfg.masterPath),
    resolveFile(cfg.dataPath)
  ]);
  masterDriveId = master.driveId; masterItemId = master.itemId;
  dataDriveId   = data.driveId;   dataItemId   = data.itemId;
}

// ================================================================
//  社員データ読み込み
//  社員マスタ.xlsx「社員マスタ」シート:
//    A列: 社員ID  B列: 氏名  C列: カードUID (新規追加)
// ================================================================
async function loadEmployees() {
  const range = await gGet(
    `/drives/${masterDriveId}/items/${masterItemId}/workbook/worksheets('社員マスタ')/usedRange`
  );
  employees = [];
  const rows = range.values;
  for (let i = 1; i < rows.length; i++) {
    const id      = String(rows[i][0] ?? '').trim();
    const name    = String(rows[i][1] ?? '').trim();
    if (!id || !name) continue;
    const cardUID = rows[i][2] ? String(rows[i][2]).trim() : '';
    employees.push({ id, name, cardUID, rowIndex: i + 1 }); // rowIndex: Excelの行番号(1始まり)
  }
}

// ================================================================
//  本日の勤怠データ読み込み
// ================================================================
async function loadTodayRecords() {
  const range = await gGet(
    `/drives/${dataDriveId}/items/${dataItemId}/workbook/worksheets('勤怠データ')/usedRange`
  );
  const today = todayStr();
  todayRecords = [];
  const rows = range.values;
  for (let i = 1; i < rows.length; i++) {
    const date  = String(rows[i][0] ?? '').trim();
    const empId = String(rows[i][1] ?? '').trim();
    const type  = String(rows[i][2] ?? '').trim();
    const time  = String(rows[i][3] ?? '').trim();
    if (date === today && empId) {
      todayRecords.push({ empId, type, time });
    }
  }
}

// ================================================================
//  勤怠登録
// ================================================================
async function registerAttendance(emp) {
  const now    = new Date();
  const time   = fmtTime(now);
  const date   = todayStr();
  const recs   = todayRecords.filter(r => r.empId === emp.id);
  const last   = recs.length ? recs[recs.length - 1].type : null;
  const newType = (last === '出勤') ? '退勤' : '出勤';

  // 楽観的更新
  todayRecords.push({ empId: emp.id, type: newType, time });
  saveBackup();
  renderTodayList();
  showScanResult(emp.name, newType, time);

  // SharePoint書き込み
  try {
    const range = await gGet(
      `/drives/${dataDriveId}/items/${dataItemId}/workbook/worksheets('勤怠データ')/usedRange`
    );
    const nextRow = range.rowCount + 1;
    await gPatch(
      `/drives/${dataDriveId}/items/${dataItemId}/workbook/worksheets('勤怠データ')/range(address='A${nextRow}:D${nextRow}')`,
      { values: [[date, emp.id, newType, time]] }
    );
  } catch(e) {
    showToast('⚠️ SharePoint書き込みエラー（ローカルには保存済み）', 4000);
    console.error(e);
  }
}

// ================================================================
//  カードUID → 社員検索
// ================================================================
function findEmployeeByUID(uid) {
  const u = uid.trim().toUpperCase();
  return employees.find(e => e.cardUID.trim().toUpperCase() === u) || null;
}

// ================================================================
//  NFC キーボードウェッジ入力キャプチャ
//  リーダーはUSB HIDキーボードとして動作し、
//  カードUIDを高速タイプ → Enterで完了
// ================================================================
document.addEventListener('keydown', function(e) {
  // input/textareaにフォーカスがある時は無視
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

  if (e.key === 'Enter') {
    e.preventDefault();
    if (nfcBuf.length >= 4) {
      const uid = nfcBuf.trim();
      nfcBuf = '';
      clearTimeout(nfcTimer);
      onNFCRead(uid);
    } else {
      nfcBuf = '';
    }
    return;
  }

  // 印刷可能文字のみバッファに追加
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    nfcBuf += e.key;
    clearTimeout(nfcTimer);
    // 200ms入力が途切れたら処理(一部リーダーはEnterを送らない)
    nfcTimer = setTimeout(() => {
      if (nfcBuf.length >= 4) {
        const uid = nfcBuf.trim();
        nfcBuf = '';
        onNFCRead(uid);
      } else {
        nfcBuf = '';
      }
    }, 200);
  }
});

function onNFCRead(uid) {
  if (nfcMode === 'register') {
    onNFCRegister(uid);
  } else {
    onNFCScan(uid);
  }
}

// ================================================================
//  スキャンモード
// ================================================================
function onNFCScan(uid) {
  if (scanCooldown) return;
  const emp = findEmployeeByUID(uid);
  if (!emp) {
    setScanError('未登録のカードです');
    showToast('⚠️ このカードは登録されていません');
    return;
  }
  scanCooldown = true;
  setTimeout(() => { scanCooldown = false; setScanReady(); }, 3000);
  registerAttendance(emp);
}

function setScanReady() {
  const ring = document.getElementById('scan-ring');
  ring.className = 'ready';
  document.getElementById('scan-icon').textContent    = '📡';
  document.getElementById('scan-msg').textContent     = 'NFCカードをリーダーにかざしてください';
  document.getElementById('scan-result').textContent  = '';
  document.getElementById('scan-sub').textContent     = '';
}

function showScanResult(name, type, time) {
  const ring = document.getElementById('scan-ring');
  ring.className = 'success';
  document.getElementById('scan-icon').textContent    = type === '出勤' ? '🟢' : '🔵';
  document.getElementById('scan-msg').textContent     = type === '出勤' ? '出勤を記録しました' : '退勤を記録しました';
  document.getElementById('scan-result').textContent  = name;
  document.getElementById('scan-sub').textContent     = `${type}  ${time}`;
}

function setScanError(msg) {
  const ring = document.getElementById('scan-ring');
  ring.className = 'error';
  document.getElementById('scan-icon').textContent   = '⚠️';
  document.getElementById('scan-msg').textContent    = msg;
  document.getElementById('scan-result').textContent = '';
  document.getElementById('scan-sub').textContent    = '';
  setTimeout(setScanReady, 2500);
}

// ================================================================
//  本日の打刻リスト描画
// ================================================================
function renderTodayList() {
  const list = document.getElementById('today-list');
  list.innerHTML = '';

  const byEmp = {};
  todayRecords.forEach(r => {
    if (!byEmp[r.empId]) byEmp[r.empId] = [];
    byEmp[r.empId].push(r);
  });

  document.getElementById('today-label').textContent = `本日の打刻（${todayRecords.length}件）`;

  Object.keys(byEmp).forEach(empId => {
    const recs  = byEmp[empId];
    const emp   = employees.find(e => e.id === empId);
    const name  = emp ? emp.name : empId;
    const inRec  = recs.find(r => r.type === '出勤');
    const outRec = recs.filter(r => r.type === '退勤').pop();

    let badge, timeStr;
    if (inRec && outRec) {
      badge   = `<span class="tr-badge badge-both">✓ 完了</span>`;
      timeStr = `${inRec.time} → ${outRec.time}`;
    } else if (inRec) {
      badge   = `<span class="tr-badge badge-in">出勤</span>`;
      timeStr = `${inRec.time} →`;
    } else {
      badge   = `<span class="tr-badge badge-out">退勤</span>`;
      timeStr = `→ ${outRec.time}`;
    }

    const row = document.createElement('div');
    row.className = 'today-row';
    row.innerHTML = `
      <div class="tr-name">${name}</div>
      ${badge}
      <div class="tr-time">${timeStr}</div>`;
    list.appendChild(row);
  });
}

// ================================================================
//  カード登録画面
// ================================================================
function openRegister() {
  nfcMode = 'register';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('register-screen').style.display = 'flex';
  renderRegList();
}

function closeRegister() {
  nfcMode = 'scan';
  document.getElementById('register-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  setScanReady();
}

function renderRegList() {
  const wrap = document.getElementById('reg-list-wrap');
  wrap.innerHTML = '';
  employees.forEach(emp => {
    const hasCard = !!emp.cardUID;
    const row = document.createElement('div');
    row.className = 'reg-emp-row';
    row.innerHTML = `
      <div>
        <div class="reg-emp-name">${emp.name}</div>
        <div class="reg-emp-id">ID: ${emp.id}</div>
      </div>
      <div class="reg-card-status ${hasCard ? 'card-registered' : 'card-none'}">
        ${hasCard ? '✓ 登録済み' : '— 未登録'}
      </div>`;
    row.addEventListener('click', () => startCardRegistration(emp));
    wrap.appendChild(row);
  });
}

function startCardRegistration(emp) {
  regTargetEmp = emp;
  capturedUID  = null;
  document.getElementById('reg-overlay-name').textContent = emp.name;
  document.getElementById('reg-overlay-msg').textContent  = emp.cardUID
    ? `登録中: ${emp.cardUID}\n新しいカードをかざしてください`
    : 'カードをリーダーにかざしてください';
  document.getElementById('reg-overlay-uid').textContent  = '';
  document.getElementById('reg-overlay-icon').textContent = '📡';
  document.getElementById('reg-overlay-ring').style.borderColor = '#4a9eff';
  document.getElementById('reg-overlay-btns').style.display = 'none';
  document.getElementById('btn-rov-delete').style.display = emp.cardUID ? 'inline-flex' : 'none';
  document.getElementById('reg-overlay').classList.add('show');
}

function onNFCRegister(uid) {
  capturedUID = uid;
  document.getElementById('reg-overlay-uid').textContent  = `読み取り: ${uid}`;
  document.getElementById('reg-overlay-icon').textContent = '✅';
  document.getElementById('reg-overlay-ring').style.borderColor = '#3fb950';
  document.getElementById('reg-overlay-msg').textContent  = 'カードを読み取りました。登録しますか？';
  document.getElementById('reg-overlay-btns').style.display = 'flex';
}

async function confirmCardRegistration() {
  if (!regTargetEmp || !capturedUID) return;
  const emp = regTargetEmp;
  const uid = capturedUID;
  document.getElementById('reg-overlay').classList.remove('show');
  showOp('カードUIDを保存中...');
  try {
    await gPatch(
      `/drives/${masterDriveId}/items/${masterItemId}/workbook/worksheets('社員マスタ')/range(address='C${emp.rowIndex}')`,
      { values: [[uid]] }
    );
    emp.cardUID = uid;
    showToast(`✅ ${emp.name} のカードを登録しました`);
    renderRegList();
  } catch(e) {
    showToast('❌ 保存失敗: ' + e.message, 5000);
  } finally {
    hideOp();
    regTargetEmp = null;
    capturedUID  = null;
  }
}

async function deleteCardRegistration() {
  if (!regTargetEmp) return;
  const emp = regTargetEmp;
  document.getElementById('reg-overlay').classList.remove('show');
  showOp('カード登録を削除中...');
  try {
    await gPatch(
      `/drives/${masterDriveId}/items/${masterItemId}/workbook/worksheets('社員マスタ')/range(address='C${emp.rowIndex}')`,
      { values: [['']] }
    );
    emp.cardUID = '';
    showToast(`🗑 ${emp.name} のカード登録を削除しました`);
    renderRegList();
  } catch(e) {
    showToast('❌ 削除失敗: ' + e.message, 5000);
  } finally {
    hideOp();
    regTargetEmp = null;
  }
}

// ================================================================
//  バックアップ / 復元
// ================================================================
function saveBackup() {
  localStorage.setItem(BK_PREFIX + todayStr(), JSON.stringify(todayRecords));
}

function checkBackupRestore() {
  const saved = localStorage.getItem(BK_PREFIX + todayStr());
  if (!saved) return;
  const bkRecs = JSON.parse(saved);
  const missing = bkRecs.filter(bk =>
    !todayRecords.some(r => r.empId === bk.empId && r.type === bk.type && r.time === bk.time)
  );
  if (!missing.length) return;
  document.getElementById('restore-count').textContent = missing.length;
  document.getElementById('restore-banner').classList.add('show');
}

async function restoreFromBackup() {
  const saved = localStorage.getItem(BK_PREFIX + todayStr());
  if (!saved) return;
  const bkRecs = JSON.parse(saved);
  const missing = bkRecs.filter(bk =>
    !todayRecords.some(r => r.empId === bk.empId && r.type === bk.type && r.time === bk.time)
  );
  if (!missing.length) { dismissRestore(); return; }
  showOp('データを復元中...');
  document.getElementById('restore-banner').classList.remove('show');
  try {
    const range = await gGet(
      `/drives/${dataDriveId}/items/${dataItemId}/workbook/worksheets('勤怠データ')/usedRange`
    );
    let nextRow = range.rowCount + 1;
    for (const r of missing) {
      await gPatch(
        `/drives/${dataDriveId}/items/${dataItemId}/workbook/worksheets('勤怠データ')/range(address='A${nextRow}:D${nextRow}')`,
        { values: [[todayStr(), r.empId, r.type, r.time]] }
      );
      todayRecords.push(r);
      nextRow++;
    }
    renderTodayList();
    showToast(`✅ ${missing.length}件のデータを復元しました`);
  } catch(e) {
    showToast('❌ 復元失敗: ' + e.message, 5000);
  } finally {
    hideOp();
  }
}

function dismissRestore() {
  document.getElementById('restore-banner').classList.remove('show');
}

// ================================================================
//  設定画面
// ================================================================
function openSettings() {
  const cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
  document.getElementById('cfg-tenant-id').value   = cfg.tenantId   || '';
  document.getElementById('cfg-client-id').value   = cfg.clientId   || '';
  document.getElementById('cfg-sp-host').value     = cfg.spHost     || '';
  document.getElementById('cfg-site-path').value   = cfg.sitePath   || '';
  document.getElementById('cfg-master-path').value = cfg.masterPath || '勤怠管理/社員マスタ.xlsx';
  document.getElementById('cfg-data-path').value   = cfg.dataPath   || '勤怠管理/勤怠データ.xlsx';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
}

// ================================================================
//  アプリ起動
// ================================================================
async function startApp(cfg) {
  await initMsal(cfg);
  setMsg('認証中...');
  await handleRedirect();
  const accs = msalInst.getAllAccounts();
  if (!accs.length) {
    await msalInst.loginRedirect({ scopes: SCOPES });
    return;
  }
  curAccount = accs[0];

  try {
    setMsg('SharePointに接続中...');
    await initSharePoint(cfg);
    setMsg('社員データ読み込み中...');
    await loadEmployees();
    setMsg('本日の打刻データ読み込み中...');
    await loadTodayRecords();
  } catch(e) {
    setMsg('エラー: ' + e.message);
    console.error(e);
    return;
  }

  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
  startClock();
  setScanReady();
  renderTodayList();
  checkBackupRestore();
}

// ================================================================
//  初期化
// ================================================================
window.addEventListener('load', async () => {
  document.getElementById('setup-redirect-uri').textContent =
    location.href.split('?')[0].split('#')[0];

  const cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
  if (!cfg.tenantId || !cfg.clientId || !cfg.spHost || !cfg.sitePath) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
    return;
  }
  startApp(cfg);
});

// ================================================================
//  イベント登録
// ================================================================
document.getElementById('btn-setup-save').addEventListener('click', () => {
  const cfg = {
    tenantId:   document.getElementById('cfg-tenant-id').value.trim(),
    clientId:   document.getElementById('cfg-client-id').value.trim(),
    spHost:     document.getElementById('cfg-sp-host').value.trim(),
    sitePath:   document.getElementById('cfg-site-path').value.trim(),
    masterPath: document.getElementById('cfg-master-path').value.trim(),
    dataPath:   document.getElementById('cfg-data-path').value.trim(),
  };
  if (!cfg.tenantId || !cfg.clientId || !cfg.spHost || !cfg.sitePath) {
    alert('全項目を入力してください');
    return;
  }
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  location.reload();
});

document.getElementById('btn-settings').addEventListener('click', openSettings);
document.getElementById('btn-signout').addEventListener('click', signOut);
document.getElementById('btn-open-reg').addEventListener('click', openRegister);
document.getElementById('btn-reg-close').addEventListener('click', closeRegister);
document.getElementById('btn-rov-confirm').addEventListener('click', confirmCardRegistration);
document.getElementById('btn-rov-cancel').addEventListener('click', () => {
  document.getElementById('reg-overlay').classList.remove('show');
  regTargetEmp = null;
  capturedUID  = null;
});
document.getElementById('btn-rov-delete').addEventListener('click', deleteCardRegistration);
document.getElementById('btn-restore').addEventListener('click', restoreFromBackup);
document.getElementById('btn-dismiss-restore').addEventListener('click', dismissRestore);
</script>
